name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build against Paper 1.21.11
        run: mvn --batch-mode clean package

      - name: Build against latest Paper API
        run: mvn --batch-mode -Ppaper-latest clean package
